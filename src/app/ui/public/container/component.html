<!--
  Wrapper de pantallas publicas (login). El bg-base ya viene del body
  via styles.css; aca posicionamos el card centrado sobre el mismo fondo
  aurora + dot-grid del hero de la landing, para que el login se sienta
  parte del mismo sitio y no una pantalla aparte.
-->
<div class="min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
  <div aria-hidden="true" class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="aurora aurora-a -top-32 -left-24 w-[36rem] h-[36rem] bg-sky-500/16"></div>
    <div class="aurora aurora-b top-10 -right-32 w-[40rem] h-[40rem] bg-blue-500/14"></div>
    <div class="aurora aurora-c bottom-0 left-1/3 w-[30rem] h-[30rem] bg-cyan-400/12"></div>
    <div class="dot-grid absolute inset-0"></div>
  </div>

  <a routerLink="/" class="press absolute top-6 left-6 flex items-center gap-2 text-sm font-bold tracking-tight">
    <img src="img/logo-mark.webp" alt="" width="28" height="28" class="w-7 h-7" />
    SaasGym
  </a>

  <div class="w-full max-w-md relative">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center mb-3">
        @if (theme.resolvedMode() === 'light') {
          <img src="img/svima_white.webp" alt="SaasGym" class="h-14 w-auto">
        } @else {
          <img src="img/vima_black.webp" alt="SaasGym" class="h-14 w-auto">
        }
      </div>
      <p class="text-sm text-foreground-subtle">Gestión de negocios POS y GYM</p>
    </div>

    <div class="a-rise bg-surface backdrop-blur-xl rounded-2xl border border-border-subtle shadow-2xl shadow-black/10 p-8">
      <router-outlet />
    </div>
  </div>
</div>
