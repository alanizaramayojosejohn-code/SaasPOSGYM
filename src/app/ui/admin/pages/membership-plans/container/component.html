<div class="a-rise max-w-7xl mx-auto px-6 py-10 space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-2xl font-bold text-foreground tracking-tight">Planes de membresía</h2>
      <p class="text-foreground-muted text-sm">Catálogo de planes que puedes asignar a los socios.</p>
    </div>
    <button (click)="openCreate()"
            class="press px-4 py-2 text-sm font-semibold bg-primary hover:bg-primary/90 text-primary-fg rounded-lg transition shadow-md shadow-primary/20 hover:shadow-lg hover:shadow-primary/30">
      Nuevo plan
    </button>
  </div>

  <!-- El formulario vive en una ventana modal sobre el listado. El @if externo
       lo destruye al cerrar para que la próxima apertura arranque limpia. -->
  @if (showForm()) {
    <app-modal-shell
      [open]="true"
      chrome="bare"
      [title]="editing() ? 'Editar plan' : 'Nuevo plan'"
      [busy]="submitting()"
      (closed)="closeForm()">
      <app-admin-membership-plans-form
        [value]="editing()"
        [services]="services()"
        [submitting]="submitting()"
        [errorMessage]="formError()"
        (submitForm)="handleSubmit($event)"
        (cancel)="closeForm()" />
    </app-modal-shell>
  }

  <!-- Ventana de solo lectura con los datos del plan. -->
  @if (viewing(); as v) {
    <app-modal-shell
      [open]="true"
      chrome="bare"
      size="md"
      title="Detalle de plan"
      (closed)="closeView()">
      <app-admin-membership-plans-detail [value]="v" (edit)="editFromView()" (closed)="closeView()" />
    </app-modal-shell>
  }

  <app-admin-membership-plans-list
    [plans]="plans()"
    [loading]="loading()"
    (edit)="openEdit($event)"
    (view)="openView($event)"
    (remove)="handleDelete($event)" />

  @if (deleting(); as p) {
    <app-confirm-delete
      [open]="true"
      title="¿Eliminar este plan?"
      [description]="deletingError() ?? 'No se puede deshacer. Si hay socios activos con este plan, la operación fallará.'"
      confirmLabel="Eliminar plan"
      [entityLabel]="p.name"
      [entitySublabel]="deletingSublabel()"
      [entityInitials]="deletingInitials()"
      [amount]="deletingPrice()"
      amountLabel="Precio"
      [submitting]="deletingSubmitting()"
      (confirmed)="confirmDelete()"
      (cancelled)="cancelDelete()" />
  }
</div>
