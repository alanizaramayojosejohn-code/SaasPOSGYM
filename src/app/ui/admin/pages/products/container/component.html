<div class="a-rise max-w-7xl mx-auto px-6 py-10 space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-2xl font-bold text-foreground tracking-tight">Productos</h2>
      <p class="text-foreground-muted text-sm">Inventario disponible para venta en caja.</p>
    </div>
    <button (click)="openCreate()"
            class="press px-4 py-2 text-sm font-semibold bg-primary hover:bg-primary/90 text-primary-fg rounded-lg transition shadow-md shadow-primary/20 hover:shadow-lg hover:shadow-primary/30">
      Nuevo producto
    </button>
  </div>

  <!-- El formulario vive en una ventana modal sobre el listado. El @if externo
       lo destruye al cerrar para que la próxima apertura arranque limpia. -->
  @if (showForm()) {
    <app-modal-shell
      [open]="true"
      chrome="bare"
      [title]="editing() ? 'Editar producto' : 'Nuevo producto'"
      [busy]="submitting()"
      (closed)="closeForm()">
      <app-admin-products-form
        [value]="editing()"
        [currentImageUrl]="editingImageUrl()"
        [categories]="categories()"
        [submitting]="submitting()"
        [errorMessage]="formError()"
        (submitForm)="handleSubmit($event)"
        (cancel)="closeForm()" />
    </app-modal-shell>
  }

  @if (actionError(); as msg) {
    <div class="text-sm text-danger bg-danger/10 border border-danger/20 rounded-lg px-3 py-2">
      {{ msg }}
    </div>
  }

  <app-admin-products-list
    [products]="products()"
    [loading]="loading()"
    (edit)="openEdit($event)"
    (remove)="handleDelete($event)"
    (toggleActive)="handleToggleActive($event)" />

  @if (deleting(); as p) {
    <app-confirm-delete
      [open]="true"
      title="¿Eliminar este producto?"
      [description]="deletingError() ?? 'Se quitará del catálogo y del POS. Las ventas históricas seguirán mostrándolo.'"
      confirmLabel="Eliminar producto"
      [entityLabel]="p.name"
      [entitySublabel]="deletingSublabel()"
      [entityInitials]="deletingInitials()"
      [amount]="deletingPrice()"
      amountLabel="Precio"
      [submitting]="deletingSubmitting()"
      (confirmed)="confirmDelete()"
      (cancelled)="cancelDelete()" />
  }
</div>
