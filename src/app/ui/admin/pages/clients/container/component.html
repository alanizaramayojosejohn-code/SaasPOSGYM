<div class="a-rise max-w-7xl mx-auto px-6 py-10 space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-2xl font-bold text-foreground tracking-tight">Clientes</h2>
      <p class="text-foreground-muted text-sm">Clientes registrados en tu negocio.</p>
    </div>
    <button (click)="openCreate()"
            class="press px-4 py-2 text-sm font-semibold bg-accent hover:bg-accent/90 text-accent-fg rounded-lg transition shadow-md shadow-primary/20 hover:shadow-lg hover:shadow-primary/30">
      Nuevo cliente
    </button>
  </div>

  <!-- El formulario vive en una ventana modal sobre el listado. El @if externo
       lo destruye al cerrar para que la próxima apertura arranque limpia. -->
  @if (showForm()) {
    <app-modal-shell
      [open]="true"
      chrome="bare"
      [title]="editing() ? 'Editar cliente' : 'Nuevo cliente'"
      [busy]="submitting()"
      (closed)="closeForm()">
      <app-admin-clients-form
        [value]="editing()"
        [submitting]="submitting()"
        [errorMessage]="formError()"
        (submitForm)="handleSubmit($event)"
        (cancel)="closeForm()" />
    </app-modal-shell>
  }

  <!-- Ventana de solo lectura con los datos del cliente. -->
  @if (viewing(); as v) {
    <app-modal-shell
      [open]="true"
      chrome="bare"
      size="md"
      title="Detalle de cliente"
      (closed)="closeView()">
      <app-admin-clients-detail [value]="v" (edit)="editFromView()" (closed)="closeView()" />
    </app-modal-shell>
  }

  @if (actionError(); as msg) {
    <div class="text-sm text-danger bg-danger/10 border border-danger/20 rounded-lg px-3 py-2">
      {{ msg }}
    </div>
  }

  <app-admin-clients-list
    [clients]="clients()"
    [loading]="loading()"
    (edit)="openEdit($event)"
    (view)="openView($event)"
    (remove)="handleDelete($event)"
    (toggleActive)="handleToggleActive($event)" />

  @if (deleting(); as c) {
    <app-confirm-delete
      [open]="true"
      title="¿Eliminar este cliente?"
      [description]="deletingError() ?? 'Esta acción no se puede deshacer. Si tiene membresías asignadas, la operación fallará.'"
      confirmLabel="Eliminar cliente"
      [entityLabel]="c.name"
      [entitySublabel]="'CI ' + c.ci"
      [entityInitials]="deletingInitials()"
      confirmWord="ELIMINAR"
      [submitting]="deletingSubmitting()"
      (confirmed)="confirmDelete()"
      (cancelled)="cancelDelete()" />
  }
</div>
