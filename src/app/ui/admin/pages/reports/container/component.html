<div class="a-rise max-w-7xl mx-auto px-6 py-10 space-y-6">
  <div>
    <h2 class="text-2xl font-bold text-foreground tracking-tight">Reportes</h2>
    <p class="text-foreground-muted text-sm">
      Ventas e inventario, cartera de clientes y costo del personal.
    </p>
  </div>

  <!-- Pestañas -->
  <div class="inline-flex bg-surface backdrop-blur-xl border border-border-subtle rounded-xl p-1 gap-1 flex-wrap">
    <button type="button" (click)="setTab('sales')"
            [class.bg-input]="tab() === 'sales'"
            [class.text-foreground]="tab() === 'sales'"
            [class.text-foreground-muted]="tab() !== 'sales'"
            class="press px-4 py-1.5 text-xs font-semibold rounded-lg transition">
      Ventas e inventario
    </button>
    <button type="button" (click)="setTab('clients')"
            [class.bg-input]="tab() === 'clients'"
            [class.text-foreground]="tab() === 'clients'"
            [class.text-foreground-muted]="tab() !== 'clients'"
            class="press px-4 py-1.5 text-xs font-semibold rounded-lg transition">
      Clientes
    </button>
    <button type="button" (click)="setTab('payroll')"
            [class.bg-input]="tab() === 'payroll'"
            [class.text-foreground]="tab() === 'payroll'"
            [class.text-foreground-muted]="tab() !== 'payroll'"
            class="press px-4 py-1.5 text-xs font-semibold rounded-lg transition">
      Nómina
    </button>
  </div>

  @if (tab() === 'sales') {
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 a-rise-sm">
      <app-admin-reports-monthly-income [rows]="monthly()" [loading]="loading()" />
      <app-admin-reports-daily-income [rows]="daily()" [loading]="loading()" />
      @if (isGym()) {
        <app-admin-reports-active-memberships [rows]="active()" [loading]="loading()" />
      }
      <app-admin-reports-low-stock [rows]="lowStock()" [loading]="loading()" />
    </div>
  }

  @if (tab() === 'clients') {
    <div class="a-rise-sm">
      <app-admin-reports-clients
        [summary]="clientSummary()"
        [monthly]="clientMonthly()"
        [loading]="loading()" />
    </div>
  }

  @if (tab() === 'payroll') {
    <div class="a-rise-sm">
      <app-admin-reports-payroll
        [summary]="payrollSummary()"
        [monthly]="payrollMonthly()"
        [byType]="deductionsByType()"
        [loading]="loading()" />
    </div>
  }
</div>
