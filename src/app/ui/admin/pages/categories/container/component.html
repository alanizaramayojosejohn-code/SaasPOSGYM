<div class="a-rise max-w-7xl mx-auto px-6 py-10 space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-2xl font-bold text-foreground tracking-tight">Categorías</h2>
      <p class="text-foreground-muted text-sm">Organiza tus productos por categorías.</p>
    </div>
    <button (click)="openCreate()"
            class="press px-4 py-2 text-sm font-semibold bg-accent hover:bg-accent/90 text-accent-fg rounded-lg transition shadow-md shadow-primary/20 hover:shadow-lg hover:shadow-primary/30">
      Nueva categoría
    </button>
  </div>

  <!-- El formulario vive en una ventana modal sobre el listado. El @if externo
       lo destruye al cerrar para que la próxima apertura arranque limpia. -->
  @if (showForm()) {
    <app-modal-shell
      [open]="true"
      chrome="bare"
      [title]="editing() ? 'Editar categoría' : 'Nueva categoría'"
      [busy]="submitting()"
      (closed)="closeForm()">
      <app-admin-categories-form
        [value]="editing()"
        [submitting]="submitting()"
        [errorMessage]="formError()"
        (submitForm)="handleSubmit($event)"
        (cancel)="closeForm()" />
    </app-modal-shell>
  }

  <app-admin-categories-list
    [categories]="categories()"
    [loading]="loading()"
    (edit)="openEdit($event)"
    (remove)="handleDelete($event)" />

  @if (deleting(); as c) {
    <app-confirm-delete
      [open]="true"
      title="¿Eliminar esta categoría?"
      [description]="deletingError() ?? 'Los productos en esta categoría quedarán sin categoría asignada.'"
      confirmLabel="Eliminar categoría"
      [entityLabel]="c.name"
      [entitySublabel]="c.description"
      [entityInitials]="deletingInitials()"
      [submitting]="deletingSubmitting()"
      (confirmed)="confirmDelete()"
      (cancelled)="cancelDelete()" />
  }
</div>
