<div class="bg-surface backdrop-blur-xl border border-border-subtle rounded-2xl p-6 space-y-6 shadow-sm">
  <!-- Header -->
  <div class="flex items-start gap-4">
    <span class="w-14 h-14 rounded-full bg-foreground text-base flex items-center justify-center text-sm font-bold flex-shrink-0">
      {{ initials() }}
    </span>
    <div class="flex-1 min-w-0">
      <div class="flex items-center gap-2 flex-wrap">
        <h3 class="font-bold text-lg text-foreground tracking-tight">{{ value().name }}</h3>
        <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[9px] font-bold uppercase tracking-wider bg-muted text-foreground-muted border border-border-subtle">
          {{ typeLabel() }}
        </span>
      </div>
      <p class="text-xs text-foreground-faint mt-0.5">Creado {{ value().created_at | date: 'dd MMM yyyy' }}</p>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <app-detail-field label="Tipo de negocio">{{ typeLabel() }}</app-detail-field>
    <app-detail-field label="ID" [mono]="true">{{ value().id.slice(0, 8) }}…</app-detail-field>
  </div>

  <div class="pt-4 border-t border-border-subtle">
    <p class="text-[11px] font-bold uppercase tracking-widest text-foreground-faint mb-3">Colores del negocio</p>
    <div class="flex items-center gap-3 p-3 rounded-xl bg-input border border-border-subtle">
      <span class="w-8 h-8 rounded-full shadow-sm flex-shrink-0" [style.background]="colors().color1"></span>
      <span class="w-8 h-8 rounded-full shadow-sm flex-shrink-0 -ml-5" [style.background]="colors().color2"></span>
      <div class="min-w-0 font-mono text-xs text-foreground-subtle">
        {{ colors().color1 }} · {{ colors().color2 }}
      </div>
    </div>
  </div>

  <div class="flex justify-end gap-3 pt-2 border-t border-border-subtle">
    <button type="button" (click)="closed.emit()"
            class="px-4 py-2 text-sm font-medium text-foreground-muted hover:bg-muted rounded-lg transition">
      Cerrar
    </button>
    <button type="button" (click)="edit.emit()"
            class="press px-4 py-2 text-sm font-semibold bg-accent hover:bg-accent/90 text-accent-fg rounded-lg transition shadow-md shadow-primary/20">
      Editar negocio
    </button>
  </div>
</div>
