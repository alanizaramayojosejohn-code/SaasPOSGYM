<div class="a-rise max-w-7xl mx-auto px-6 py-10 space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-2xl font-bold text-foreground tracking-tight">Negocios</h2>
      <p class="text-foreground-muted text-sm">Cada negocio es un tenant aislado. Tipos: POS o gimnasio.</p>
    </div>
    <button (click)="openCreate()"
            class="press px-4 py-2 text-sm font-semibold bg-primary hover:bg-primary/90 text-primary-fg rounded-lg transition shadow-md shadow-primary/20 hover:shadow-lg hover:shadow-primary/30">
      Nuevo negocio
    </button>
  </div>

  <!-- El formulario vive en una ventana modal sobre el listado. El @if externo
       lo destruye al cerrar para que la próxima apertura arranque limpia. -->
  @if (showForm()) {
    <app-modal-shell
      [open]="true"
      chrome="bare"
      [title]="editing() ? 'Editar negocio' : 'Nuevo negocio'"
      [busy]="submitting()"
      (closed)="closeForm()">
      <app-saas-businesses-form
        [value]="editing()"
        [submitting]="submitting()"
        [errorMessage]="formError()"
        (submitForm)="handleSubmit($event)"
        (cancel)="closeForm()" />
    </app-modal-shell>
  }

  <app-saas-businesses-list
    [businesses]="businesses()"
    [loading]="loading()"
    (edit)="openEdit($event)"
    (remove)="handleDelete($event)" />

  @if (deleting(); as b) {
    <app-confirm-delete
      [open]="true"
      title="¿Eliminar este negocio?"
      [description]="deletingError() ?? 'Borra TODO en cascada: usuarios, socios, productos, planes, ventas, membresías y asistencias. No se puede deshacer.'"
      confirmLabel="Eliminar negocio"
      [entityLabel]="b.name"
      [entitySublabel]="deletingSublabel()"
      [entityInitials]="deletingInitials()"
      confirmWord="ELIMINAR"
      [submitting]="deletingSubmitting()"
      (confirmed)="confirmDelete()"
      (cancelled)="cancelDelete()" />
  }
</div>
